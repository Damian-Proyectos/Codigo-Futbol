<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codigo-Futbol | LaLiga Hypermotion</title>

    <!-- Tailwind CSS CDN para clases utilitarias -->
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen">

    <!-- BARRA DE NAVEGACIÓN -->
    <header class="navbar bg-slate-900/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="text-xl font-black tracking-wider text-white">Codigo<span class="text-emerald-400">Futbol</span></a>
            <nav>
                <ul class="flex space-x-6 text-sm font-medium">
                    <li><a href="index.html" class="hover:text-emerald-400 transition-colors">Inicio</a></li>
                    <li><a href="partido-detalle.html" class="hover:text-emerald-400 transition-colors">Partido Detalle</a></li>
                    <li><a href="perfil.html" class="hover:text-emerald-400 transition-colors">Mi Perfil</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container mx-auto px-4 my-8 max-w-4xl">

        <!-- SECCIÓN VOTACIÓN MVP ELEGANTE Y DEPORTIVA -->
        <section id="mvp" class="mvp-section my-10 p-6 bg-slate-900/90 border border-slate-800 rounded-2xl shadow-xl">
            <div class="flex items-center justify-between mb-6">
                <div>
                    <span class="text-xs font-semibold uppercase tracking-wider text-emerald-400 bg-emerald-950/60 border border-emerald-800/50 px-3 py-1 rounded-full">Encuesta Oficial</span>
                    <h2 class="text-2xl font-bold text-white mt-2">🏆 Jugador de la Jornada</h2>
                </div>
                <span class="text-xs text-slate-400">LaLiga Hypermotion</span>
            </div>
            
            <!-- Grupo de Opciones Custom -->
            <div class="mvp-radio-group grid grid-cols-1 md:grid-cols-3 gap-4">
                
                <!-- Candidato 1 -->
                <label class="mvp-card-option">
                    <input type="radio" name="mvp-option" value="1" checked class="hidden-radio">
                    <div class="card-content">
                        <div class="flex items-center space-x-3 mb-2">
                            <div class="radio-indicator"></div>
                            <span class="font-bold text-white text-base">Francho Serrano</span>
                        </div>
                        <p class="text-xs text-slate-400 pl-7">Real Zaragoza</p>
                    </div>
                </label>

                <!-- Candidato 2 -->
                <label class="mvp-card-option">
                    <input type="radio" name="mvp-option" value="2" class="hidden-radio">
                    <div class="card-content">
                        <div class="flex items-center space-x-3 mb-2">
                            <div class="radio-indicator"></div>
                            <span class="font-bold text-white text-base">Javi Puado</span>
                        </div>
                        <p class="text-xs text-slate-400 pl-7">RCD Espanyol</p>
                    </div>
                </label>

                <!-- Candidato 3 -->
                <label class="mvp-card-option">
                    <input type="radio" name="mvp-option" value="3" class="hidden-radio">
                    <div class="card-content">
                        <div class="flex items-center space-x-3 mb-2">
                            <div class="radio-indicator"></div>
                            <span class="font-bold text-white text-base">Nico Fernández</span>
                        </div>
                        <p class="text-xs text-slate-400 pl-7">Elche CF</p>
                    </div>
                </label>

            </div>
            <button class="w-full mt-5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3 rounded-xl transition-all shadow-lg shadow-emerald-500/10">Confirmar Voto MVP</button>
        </section>

        <!-- SECCIÓN FEEDBACK / DEBATE FAN ESTÉTICO Y OSCURO -->
        <section id="comunidad" class="community-section my-10">
            <h2 class="text-2xl font-bold text-white mb-6 flex items-center gap-2">
                💬 Zona de Opinión
            </h2>
            
            <div class="bg-slate-900 border border-slate-800 grid grid-cols-6 gap-3 rounded-2xl p-5 text-sm shadow-xl max-w-xl mx-auto">
                <h3 class="text-slate-200 text-lg font-bold col-span-6 flex items-center justify-between">
                    <span>Deja tu comentario del partido</span>
                    <span class="text-xs font-normal text-slate-400">Comunidad Fan</span>
                </h3>
                
                <textarea placeholder="¿Qué te ha parecido el planteamiento táctico de esta jornada?..." class="bg-slate-950 text-slate-200 h-28 placeholder:text-slate-500 border border-slate-800 col-span-6 resize-none outline-none rounded-xl p-3 duration-300 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500"></textarea>
                
                <!-- Botón Reacción Positiva -->
                <button type="button" class="col-span-1 flex justify-center items-center rounded-xl p-2.5 duration-300 bg-slate-950 text-slate-400 hover:text-emerald-400 hover:border-emerald-500/50 border border-slate-800 focus:text-emerald-400 focus:bg-emerald-950/40" title="Me gustó">
                    <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 0 512 512" fill="currentColor">
                        <path d="M464 256A208 208 0 1 0 48 256a208 208 0 1 0 416 0zM0 256a256 256 0 1 1 512 0A256 256 0 1 1 0 256zm177.6 62.1C192.8 334.5 218.8 352 256 352s63.2-17.5 78.4-33.9c9-9.7 24.2-10.4 33.9-1.4s10.4 24.2 1.4 33.9c-22 23.8-60 49.4-113.6 49.4s-91.7-25.5-113.6-49.4c-9-9.7-8.4-24.9 1.4-33.9s24.9-8.4 33.9 1.4zM144.4 208a32 32 0 1 1 64 0 32 32 0 1 1 -64 0zm192-32a32 32 0 1 1 0 64 32 32 0 1 1 0-64z"></path>
                    </svg>
                </button>
                
                <!-- Botón Reacción Negativa -->
                <button type="button" class="col-span-1 flex justify-center items-center rounded-xl p-2.5 duration-300 bg-slate-950 text-slate-400 hover:text-rose-400 hover:border-rose-500/50 border border-slate-800 focus:text-rose-400 focus:bg-rose-950/40" title="No me gustó">
                    <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 0 512 512" fill="currentColor">
                        <path d="M464 256A208 208 0 1 0 48 256a208 208 0 1 0 416 0zM0 256a256 256 0 1 1 512 0A256 256 0 1 1 0 256zM174.6 384.1c-4.5 12.5-18.2 18.9-30.7 14.4s-18.9-18.2-14.4-30.7C146.9 319.4 198.9 288 256 288s109.1 31.4 126.6 79.9c4.5 12.5-2 26.2-14.4 30.7s-26.2-2-30.7-14.4C328.2 358.5 297.2 336 256 336s-72.2 22.5-81.4 48.1zM144.4 208a32 32 0 1 1 64 0 32 32 0 1 1 -64 0zm192-32a32 32 0 1 1 0 64 32 32 0 1 1 0-64z"></path>
                    </svg>
                </button>

                <span class="col-span-2"></span>

                <!-- Botón Enviar -->
                <button class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 border border-emerald-400/30 col-span-2 flex justify-center items-center rounded-xl p-2.5 duration-300 font-bold transition-all shadow-md shadow-emerald-500/10">
                    <span class="mr-2 hidden sm:inline text-xs uppercase tracking-wider">Publicar</span>
                    <svg fill="none" viewBox="0 0 24 24" height="20px" width="20px" xmlns="http://www.w3.org/2000/svg" stroke="currentColor">
                        <path stroke-linejoin="round" stroke-linecap="round" stroke-width="2" d="M7.39999 6.32003L15.89 3.49003C19.7 2.22003 21.77 4.30003 20.51 8.11003L17.68 16.6C15.78 22.31 12.66 22.31 10.76 16.6L9.91999 14.08L7.39999 13.24C1.68999 11.34 1.68999 8.23003 7.39999 6.32003Z"></path>
                        <path stroke-linejoin="round" stroke-linecap="round" stroke-width="2" d="M10.11 13.6501L13.69 10.0601"></path>
                    </svg>
                </button>
            </div>
        </section>

    </main>

    <script src="js/interacciones.js"></script>
</body>
</html>
