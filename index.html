<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codigo-Futbol | LaLiga Hypermotion</title>

    <!-- Tailwind CSS CDN para los componentes de Uiverse -->
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>

    <main class="container my-8">

        <!-- SECCIÓN VOTACIÓN MVP CON PIXEL RADIO BUTTONS -->
        <section id="mvp" class="mvp-section my-8 p-6 bg-slate-900 rounded-xl">
            <h2 class="text-2xl font-bold text-white mb-4">🎮 Selección Rapida de MVP (Modo Retro)</h2>
            
            <div class="uiverse-pixel-radio-group">
                <label class="uiverse-pixel-radio">
                    <input type="radio" name="mvp-option" value="1" checked>
                    <span>Jugador 1 - Real Zaragoza</span>
                </label>

                <label class="uiverse-pixel-radio">
                    <input type="radio" name="mvp-option" value="2">
                    <span>Jugador 2 - RCD Espanyol</span>
                </label>

                <label class="uiverse-pixel-radio">
                    <input type="radio" name="mvp-option" value="3">
                    <span>Jugador 3 - Elche CF</span>
                </label>
            </div>
        </section>

        <!-- SECCIÓN FEEDBACK / DEBATE FAN (COMPONENT UIVERSE) -->
        <section id="comunidad" class="community-section my-8">
            <h2 class="text-2xl font-bold text-white mb-4">💬 Tu Opinión de la Jornada</h2>
            
            <div class="bg-white border border-slate-200 grid grid-cols-6 gap-2 rounded-xl p-4 text-sm max-w-xl mx-auto shadow-lg">
                <h1 class="text-center text-slate-700 text-xl font-bold col-span-6">Envía tu Feedback / Opinión</h1>
                
                <textarea placeholder="Escribe aquí tu opinión sobre el partido..." class="bg-slate-100 text-slate-700 h-28 placeholder:text-slate-500 placeholder:opacity-50 border border-slate-200 col-span-6 resize-none outline-none rounded-lg p-3 duration-300 focus:border-slate-600"></textarea>
                
                <!-- Botón Reacción Positiva -->
                <button class="fill-slate-600 col-span-1 flex justify-center items-center rounded-lg p-2 duration-300 bg-slate-100 hover:border-slate-600 focus:fill-blue-200 focus:bg-blue-400 border border-slate-200" title="Me gustó">
                    <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 0 512 512">
                        <path d="M464 256A208 208 0 1 0 48 256a208 208 0 1 0 416 0zM0 256a256 256 0 1 1 512 0A256 256 0 1 1 0 256zm177.6 62.1C192.8 334.5 218.8 352 256 352s63.2-17.5 78.4-33.9c9-9.7 24.2-10.4 33.9-1.4s10.4 24.2 1.4 33.9c-22 23.8-60 49.4-113.6 49.4s-91.7-25.5-113.6-49.4c-9-9.7-8.4-24.9 1.4-33.9s24.9-8.4 33.9 1.4zM144.4 208a32 32 0 1 1 64 0 32 32 0 1 1 -64 0zm192-32a32 32 0 1 1 0 64 32 32 0 1 1 0-64z"></path>
                    </svg>
                </button>
                
                <!-- Botón Reacción Negativa -->
                <button class="fill-slate-600 col-span-1 flex justify-center items-center rounded-lg p-2 duration-300 bg-slate-100 hover:border-slate-600 focus:fill-blue-200 focus:bg-blue-400 border border-slate-200" title="No me gustó">
                    <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 0 512 512">
                        <path d="M464 256A208 208 0 1 0 48 256a208 208 0 1 0 416 0zM0 256a256 256 0 1 1 512 0A256 256 0 1 1 0 256zM174.6 384.1c-4.5 12.5-18.2 18.9-30.7 14.4s-18.9-18.2-14.4-30.7C146.9 319.4 198.9 288 256 288s109.1 31.4 126.6 79.9c4.5 12.5-2 26.2-14.4 30.7s-26.2-2-30.7-14.4C328.2 358.5 297.2 336 256 336s-72.2 22.5-81.4 48.1zM144.4 208a32 32 0 1 1 64 0 32 32 0 1 1 -64 0zm192-32a32 32 0 1 1 0 64 32 32 0 1 1 0-64z"></path>
                    </svg>
                </button>

                <span class="col-span-2"></span>

                <!-- Botón Enviar -->
                <button class="bg-slate-100 stroke-slate-600 border border-slate-200 col-span-2 flex justify-center items-center rounded-lg p-2 duration-300 hover:border-slate-600 hover:bg-slate-800 hover:stroke-white focus:stroke-blue-200 focus:bg-blue-400">
                    <svg fill="none" viewBox="0 0 24 24" height="24px" width="24px" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linejoin="round" stroke-linecap="round" stroke-width="1.5" d="M7.39999 6.32003L15.89 3.49003C19.7 2.22003 21.77 4.30003 20.51 8.11003L17.68 16.6C15.78 22.31 12.66 22.31 10.76 16.6L9.91999 14.08L7.39999 13.24C1.68999 11.34 1.68999 8.23003 7.39999 6.32003Z"></path>
                        <path stroke-linejoin="round" stroke-linecap="round" stroke-width="1.5" d="M10.11 13.6501L13.69 10.0601"></path>
                    </svg>
                </button>
            </div>
        </section>

    </main>

    <script src="js/interacciones.js"></script>
</body>
</html>
