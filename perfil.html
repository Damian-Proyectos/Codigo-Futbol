<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codigo-Futbol | Mi Perfil</title>
    
    <!-- Hojas de estilo modularizadas -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    
    <!-- Fuente Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- CABECERA DE NAVEGACIÓN -->
    <header class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">Codigo<span>Futbol</span></a>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">← Volver a Inicio</a></li>
                    <li><a href="partido-detalle.html">Último Partido</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- CONTENIDO DEL PERFIL -->
    <main class="container">
        <section class="profile-section">
            <h2 class="section-title">👤 Panel de Aficionado</h2>

            <!-- Tarjeta Principal del Usuario -->
            <div class="profile-card">
                <div class="profile-header">
                    <div class="profile-avatar">⚽</div>
                    <div class="profile-info">
                        <h3>JuanPerez_DAW</h3>
                        <p class="user-role">Miembro de la Comunidad</p>
                        <span class="badge-team">Real Zaragoza Fan</span>
                    </div>
                </div>

                <!-- Estadísticas del Usuario en la Web -->
                <div class="profile-stats">
                    <div class="stat-box">
                        <span class="stat-number">14</span>
                        <span class="stat-title">Votos MVP</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-number">28</span>
                        <span class="stat-title">Comentarios</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-number">Nivel 2</span>
                        <span class="stat-title">Rango Fan</span>
                    </div>
                </div>

                <!-- Formulario de Edición de Perfil -->
                <form id="profile-form" class="profile-form">
                    <h4>⚙️ Configuración del Perfil</h4>

                    <div class="form-group">
                        <label for="nickname">Nombre de Usuario / Apodo</label>
                        <input type="text" id="nickname" value="JuanPerez_DAW" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" value="juan.perez@ejemplo.com" required>
                    </div>

                    <div class="form-group">
                        <label for="fav-team">Equipo Favorito (LaLiga Hypermotion)</label>
                        <select id="fav-team">
                            <option value="zaragoza" selected>Real Zaragoza</option>
                            <option value="espanyol">RCD Espanyol</option>
                            <option value="elche">Elche CF</option>
                            <option value="valladolid">Real Valladolid</option>
                            <option value="sporting">Sporting de Gijón</option>
                            <option value="oviedo">Real Oviedo</option>
                            <option value="otro">Otro club...</option>
                        </select>
                    </div>

                    <button type="submit" class="btn-save">Guardar Cambios</button>
                </form>
            </div>
        </section>
    </main>

    <!-- PIE DE PÁGINA -->
    <footer>
        <div class="container footer-content">
            <p>&copy; Codigo-Futbol - La Comunidad Fan de LaLiga Hypermotion</p>
        </div>
    </footer>

    <!-- Script de interacciones -->
    <script src="js/interacciones.js"></script>
</body>
</html>
